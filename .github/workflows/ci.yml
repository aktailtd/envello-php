name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json

      - run: composer validate --strict
      - run: php -l src/Envello.php
      - run: php -l src/EnvelloException.php
